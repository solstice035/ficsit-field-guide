name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage floor (src/lib/calc ≥95% lines)
        run: npm run coverage
      - run: npm run build

  data:
    name: Game data cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch pinned sources
        run: npm run data:fetch
      - run: npm run data:verify

  model:
    name: Knowledge model in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: python3 -m pip install --user uv==0.11.32
      - name: Regenerate model/generated from the LinkML schema
        run: sh model/gen.sh
      - name: Fail if model/generated is stale
        run: git diff --exit-code -- model/generated
